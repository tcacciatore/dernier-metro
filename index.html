// Remplit la fenêtre en gardant le 16:9, avec un facteur entier en pixels
// physiques : chaque pixel logique = k×k pixels écran (net, sans flou),
// et le texte est rendu à la vraie résolution de l'écran (Retina compris).
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H) * dpr));
  if (k !== RES || cv.width !== W * k) {
    RES = k;
    cv.width = W * k;
    cv.height = H * k;
  }
  g.imageSmoothingEnabled = false;
  cv.style.width = (W * k / dpr) + 'px';
  cv.style.height = (H * k / dpr) + 'px';
}
addEventListener('resize', fit);
if (window.matchMedia) {
  // suit les changements de densité (déplacement vers un autre écran, zoom)
  const watchDpr = () => matchMedia(`(resolution: ${devicePixelRatio}dppx)`)
    .addEventListener('change', () => { fit(); watchDpr(); }, { once: true });
  watchDpr();
}
fit();
cv.focus();

// trajet le plus rapide réaliste : pleine traction (1,1 m/s²), vitesse max, freinage franc (1,5 m/s²)
function legTime(d, a, b, vmax) {      // trajet le plus rapide : pleine traction, vitesse max, freinage franc
  const vp = Math.min(vmax, Math.sqrt(2 * d * a * b / (a + b)));
  return vp / a + vp / b + Math.max(0, d - vp * vp / (2 * a) - vp * vp / (2 * b)) / vp;
}

    else s.arr = T0;
    s.pos = p; s.dep = s.arr + (i === 0 ? 25 : L.dwell);
    s.baseArr = s.arr; s.baseDep = s.dep;
    s.served = false;
    s.res = { pen: 0, inc: [], dt: null, err: null, pts: 0, skipped: false, board: 0, left: 0, offer: 0 };
    s.people = [];

    const n = Math.round(s.aff * PERIODS[PER].affMul * L.aff * (17 + Math.random() * 8));
    for (let k = 0; k < n; k++) s.people.push(mkPerson(p - 68 + Math.random() * 70, 2.4 + Math.random() * 3.2));
  });
}

let AC = null, motor, motorGain, squeal, squealGain, rumbleGain, rumbleFilt, crowdGain, hissGain, whine, whineGain, railAcc = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    motor = AC.createOscillator(); motor.type = 'sawtooth';
    const filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 500;
    motorGain = AC.createGain(); motorGain.gain.value = 0;
    motor.connect(filt).connect(motorGain).connect(AC.destination); motor.start();
    squeal = AC.createOscillator(); squeal.type = 'sine'; squeal.frequency.value = 1900;
    squealGain = AC.createGain(); squealGain.gain.value = 0;
    squeal.connect(squealGain).connect(AC.destination); squeal.start();
    // sifflement des moteurs de traction (rames sur pneus), qui monte avec la vitesse
    whine = AC.createOscillator(); whine.type = 'triangle'; whine.frequency.value = 200;
    const wf = AC.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 900; wf.Q.value = 0.8;
    whineGain = AC.createGain(); whineGain.gain.value = 0;
    whine.connect(wf).connect(whineGain).connect(AC.destination); whine.start();
    // bruits de fond en boucle : roulement dans le tunnel + brouhaha de quai
    const nb = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const loop = (type, f, q) => { const src = AC.createBufferSource(); src.buffer = nb; src.loop = true; const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const gn = AC.createGain(); gn.gain.value = 0; src.connect(fl).connect(gn).connect(AC.destination); src.start(); return [gn, fl]; };

// ---------- Horaire : avance / retard par rapport à un train de référence parfaitement à l'heure ----------
// Le train de référence part à l'heure de départ, accélère (0,8 m/s²), roule, freine (1,2 m/s²)

  face([xe, yf], [xe, yp], d0, d1, sh(C.face, f));
  // quai : dallage alterné, bande podotactile, bordure
  poly([[xe, yp, d1], [xb, yp, d1], [xb, yp, d0], [xe, yp, d0]], sh(C.plat, f * tile));
  poly([[xe + 0.5, yp, d1], [xe + 0.62, yp, d1], [xe + 0.62, yp, d0], [xe + 0.5, yp, d0]], sh([95, 92, 96], f));
  const inBZ = BZ && p0 + STEP > BZ.from && p0 < BZ.to;

  face([xb, 1.2], [xb, yp], d0, d1, sh(C.stTile, f * tile));
  face([xb, yp + 0.18], [xb, yp], d0, d1, sh([60, 70, 90], f));          // plinthe
  face([xl, yf + 0.0], [xl, -1.7], d0, d1, sh([60, 70, 90], f));          // plinthe côté voie
  if (d0 < 60) for (const yy of [-1.2, -0.6, 0, 0.6]) face([xl, yy], [xl, yy + 0.03], d0, d1, sh(C.stTile, f * 0.8));
  if (d0 < 60) for (const yy of [-0.3, 0.3, 0.9]) face([xb, yy + 0.03], [xb, yy], d0, d1, sh(C.stTile, f * 0.8));

  poly([[xb - 0.18, yp + 0.002, d1], [xb, yp + 0.002, d1], [xb, yp + 0.002, d0], [xb - 0.18, yp + 0.002, d0]], 'rgba(0,0,0,0.14)');
  face([xe, yp - 0.02], [xe, yp - 0.3], d0, d1, 'rgba(0,0,0,0.3)');                                                                    // ombre sous le nez de quai
  poly([[xl, yf + 0.001, d1], [xl + 0.5, yf + 0.001, d1], [xl + 0.5, yf + 0.001, d0], [xl, yf + 0.001, d0]], 'rgba(0,0,0,0.25)');

  }

  // affiches côté quai (cadre + visuel)
  [-70, -62, -48, -40, -14, -6].forEach((off, i) => {
    if (rel === off) {
      poly([[xb - 0.01, -0.5, d0 + 4.1], [xb - 0.01, 1.18, d0 + 4.1], [xb - 0.01, 1.18, d0 - 0.1], [xb - 0.01, -0.5, d0 - 0.1]], sh([196, 146, 72], f));

  }

  [-74, -62, -50, -38, -26, -14, -2].forEach((off, i) => {
    if (rel === off) {

      poly([[xb - 0.04, 1.3, d0 + 4], [xb - 0.04, 1.8, d0 + 4], [xb - 0.04, 1.8, d0], [xb - 0.04, 1.3, d0]], '#1d3c8f');

        g.fillText(s.name, ax, ay + 1, w - 2);

  });
}

// ---------- Publicités personnalisées : images déposées dans pubs/ et listées dans pubs/pubs.json ----------

const CUSTOM_ADS = []; let CUSTOM_MODE = 'melanger';
function loadCustomAds() {
  try {
    fetch('pubs/pubs.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(cfg => {
      if (!cfg || !Array.isArray(cfg.pubs)) return;
      CUSTOM_MODE = cfg.mode === 'remplacer' ? 'remplacer' : 'melanger';
      cfg.pubs.forEach((pb, i) => {
        if (!pb || !pb.image) return;
        const img = new Image();
        img.onload = () => {
          let avg = '#3a3a3a';   // couleur moyenne, utilisée quand l'affiche est trop loin pour être détaillée
          try { const c = document.createElement('canvas'); c.width = c.height = 1; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 1, 1); const d = x.getImageData(0, 0, 1, 1).data; avg = `rgb(${d[0]},${d[1]},${d[2]})`; } catch (e) {}
          CUSTOM_ADS[i] = { title: 'pub:' + pb.image, nom: pb.nom || pb.image, img, bg: [avg, avg] };
        };
        img.src = 'pubs/' + encodeURI(pb.image);

    }).catch(() => {});
  } catch (e) {}
}
loadCustomAds();
function adPool() {
  const mine = CUSTOM_ADS.filter(Boolean);

function drawPoster(x, e, y0, y1, z0, z1, seed, f) {
  const pool = adPool(), ad = pool[((seed % pool.length) + pool.length) % pool.length], xx = x + e * 0.03;
  // sur le mur de droite (e < 0), la gauche de l'affiche est au loin ; sur celui de gauche, au près
  const zAt = u => e < 0 ? z1 - (z1 - z0) * u / AD_W : z0 + (z1 - z0) * u / AD_W;
  const wpx = Math.abs(P(xx, y1, z0)[0] - P(xx, y1, z1)[0]);
  if (wpx <= 14) {   // trop loin : simple aplat de la couleur de fond
    poly([[xx, y0, z0], [xx, y1, z0], [xx, y1, z1], [xx, y0, z1]], ad.bg[0]);
  } else {
    // découpe en bandes verticales : chacune est déformée selon sa propre position sur le mur,
    // ce qui suit la vraie perspective (une seule déformation globale faisait glisser le contenu)
    const tex = ad.img || adTexture(ad), N = 20, du = AD_W / N;
    const tw = ad.img ? ad.img.naturalWidth : AD_W * AD_RES, th = ad.img ? ad.img.naturalHeight : AD_H * AD_RES;
    for (let i = 0; i < N; i++) {
      const u0 = i * du, u1 = u0 + du;
      const A = P(xx, y1, zAt(u0)), B = P(xx, y1, zAt(u1)), Cb = P(xx, y0, zAt(u0)), Db = P(xx, y0, zAt(u1));
      g.save();
      g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.lineTo(Db[0], Db[1]); g.lineTo(Cb[0], Cb[1]); g.closePath(); g.clip();
      // repère local de la bande : axe horizontal le long du haut, axe vertical sur son bord gauche
      g.transform((B[0] - A[0]) / du, (B[1] - A[1]) / du, (Cb[0] - A[0]) / AD_H, (Cb[1] - A[1]) / AD_H, A[0], A[1]);
      g.drawImage(tex, u0 / AD_W * tw, 0, du / AD_W * tw, th, 0, 0, du * 1.06, AD_H);
      g.restore();
    }
  }
  if (f < 1) poly([[xx, y0, z0], [xx, y1, z0], [xx, y1, z1], [xx, y0, z1]], `rgba(${FOG_ST.join(',')},${(1 - f).toFixed(3)})`);   // brume au loin
}

// petite tête de mort pixel (aide visuelle optionnelle, touche H)
const SKULL = ['01110', '11111', '10101', '11111', '01010'];
function drawSkull(cx, by, px) {
  const bob = Math.round(Math.sin(S.t * 6) * px);
  const x0 = Math.round(cx - 2.5 * px), y0 = Math.round(by - 5 * px) + bob;
  g.fillStyle = '#000'; g.fillRect(x0 - 1, y0 - 1, 5 * px + 2, 5 * px + 2);
  SKULL.forEach((row, j) => [...row].forEach((c, i) => { g.fillStyle = c === '1' ? '#ff3b3b' : '#000'; g.fillRect(x0 + i * px, y0 + j * px, px, px); }));
}

// sx, sy : pieds à l'écran ; sc : pixels par mètre ; walk : phase de marche cumulée
function drawPerson(sx, sy, sc, pp, walk = 0) {
  const H0 = pp.h * sc;
  if (H0 < 1.5) return null;
  const dev = H0 * RES * DRAW_K;                       // taille réelle à l'écran → niveau de détail
  const D1 = dev >= 16, D2 = dev >= 42, D3 = dev >= 75;
  const t = (S ? S.t : 0) + pp.seed * 37;
  // en mouvement ? (la phase de marche a changé récemment)
  if (walk !== pp._lw) { pp._lw = walk; pp._mt = S.t; }
  const moving = walk > 0 && S.t - (pp._mt || -9) < 0.15;
  const run = moving && pp.runner, dir = pp.dir || 1;
  const sus = !!pp.suspect;
  const kids = pp.kind === 'child';

  // ---- fauteuil roulant : personne assise
  if (pp.kind === 'wheel') return drawWheelchair(sx, sy, sc, pp, t, D1, D2, D3);

  const H = H0;
  const stride = moving ? Math.sin(walk * (run ? 0.8 : 1)) : 0;
  const bob = moving ? -Math.abs(Math.sin(walk)) * H * (run ? 0.035 : 0.018) : Math.sin(t * 1.7) * H * 0.005;
  // balancement au repos, plus marqué pour les fêtards ; bousculade dans la foule
  let sway = moving ? 0 : Math.sin(t * 0.45) * H * 0.012 * (pp.party ? 3.5 : 1);
  if (JOSTLE && !moving) sway += (Math.sin(t * 2.3) + Math.sin(t * 3.7 + 1)) * H * 0.012 * JOSTLE;
  const cx = sx + sway;
  const lean = run ? H * 0.12 * dir : sus ? H * 0.03 * dir : (pp.acc === 'stroller' && moving ? H * 0.04 * dir : 0);
  const LX = y => cx + lean * (sy - y) / H;    // décalage d'inclinaison selon la hauteur

  const build = pp.build || 1;
  const shW = H * (kids ? 0.25 : 0.245) * build, hipW = H * 0.185 * build;
  const hipY = sy - H * (kids ? 0.45 : 0.5) + bob * 0.5;
  const shY = sy - H * (kids ? 0.74 : 0.805) + bob + (sus ? H * 0.025 : 0);
  const headR = H * (kids ? 0.095 : 0.068);
  const headY = shY - headR * (sus ? 0.9 : 1.2) - H * 0.01;
  const headX = LX(headY) + (sus ? H * 0.02 * dir : 0);
  const shX = LX(shY), hipX = LX(hipY);
  const skin = pc(pp.k), skinD = pc(pp.k, 0.8);
  const cloth = pc(pp.c), clothD = pc(pp.c, 0.72), clothL = pc(pp.c, 1.18);
  const onPhone = pp.acc === 'phone';
  const longLow = pp.outfit === 'coat' || pp.outfit === 'dress';

  // ombre portée
  g.fillStyle = `rgba(0,0,0,${0.28 * PL_F})`; g.beginPath(); g.ellipse(sx, sy, shW * 0.9, Math.max(0.5, shW * 0.22), 0, 0, 7); g.fill();

  // ---- arrière-plan : cheveux longs, capuche baissée, sac à dos, valise
  if (D1 && (pp.hairStyle === 'long') && pp.hat !== 'hood') {
    quad([headX - headR * 1.05, headY], [headX + headR * 1.05, headY], [shX + shW * 0.36, shY + H * 0.07], [shX - shW * 0.36, shY + H * 0.07], pc(pp.hair, 0.85));
  }
  if (D2 && pp.hat === 'hoodDown') circ(shX, shY - headR * 0.1, headR * 1.05, clothD);
  const pack = pp.acc === 'backpack' || pp.acc2 === 'backpack';
  if (D1 && pack) {
    const bw = shW * 0.95, bh = H * 0.25;
    quad([shX - bw / 2 - dir * shW * 0.12, shY + H * 0.02], [shX + bw / 2 - dir * shW * 0.12, shY + H * 0.02], [shX + bw / 2 - dir * shW * 0.15, shY + bh], [shX - bw / 2 - dir * shW * 0.15, shY + bh], pc(pp.bag, 0.8));
  }
  if (D1 && pp.acc2 === 'suitcase') {
    const kx = cx - dir * shW * 0.95, kw = H * 0.17, kh = H * 0.3;
    g.fillStyle = pc(pp.bag); g.fillRect(kx - kw / 2, sy - kh - H * 0.02, kw, kh);
    if (D2) { g.fillStyle = pc(pp.bag, 0.7); g.fillRect(kx - kw / 2, sy - kh * 0.55, kw, kh * 0.05); circ(kx - kw * 0.3, sy - H * 0.01, H * 0.012, '#111'); circ(kx + kw * 0.3, sy - H * 0.01, H * 0.012, '#111'); }
    seg(kx, sy - kh - H * 0.02, kx, sy - kh - H * 0.1, H * 0.012, '#333');
  }

  // ---- jambes + chaussures
  const legW = hipW * 0.46, footY = sy;
  const kneeLift = run ? H * 0.06 : H * 0.015;
  const legs = [-1, 1].map(s => {
    const off = moving ? s * stride * H * (run ? 0.2 : 0.12) : 0;
    const lift = moving ? Math.max(0, s * Math.cos(walk)) * kneeLift : 0;
    return { hx: hipX + s * hipW * 0.24, fx: cx + s * hipW * 0.24 + off, fy: footY - lift };
  });
  const legCol = (pp.outfit === 'skirt' || pp.outfit === 'dress') ? pc(pp.tights || '#2a2226') : pc(pp.pants);
  const legColD = (pp.outfit === 'skirt' || pp.outfit === 'dress') ? pc(pp.tights || '#2a2226', 0.75) : pc(pp.pants, 0.72);
  legs.forEach((l, i) => {
    const w0 = legW * (pp.outfit === 'puffer' ? 1.05 : 1);
    // genou : fléchi vers l'avant pendant la foulée, légèrement au repos
    const ph = walk + (i ? 0 : Math.PI), bend = moving ? H * (run ? 0.07 : 0.035) * Math.max(0, Math.sin(ph)) : H * 0.004;
    const kx = (l.hx + l.fx) / 2 + dir * bend, ky = (hipY + l.fy) / 2 - (moving ? bend * 0.3 : 0);
    if (D1) {
      limb(l.hx, hipY + w0 * 0.3, kx, ky, l.fx, l.fy - H * 0.035, w0, i ? legCol : legColD);
      g.fillStyle = `rgba(0,0,0,${0.12 * PL_F})`; g.beginPath(); g.arc(kx, ky, w0 * 0.22, 0, 7); g.fill();   // pli du genou
    } else quad([l.hx - w0 / 2, hipY], [l.hx + w0 / 2, hipY], [l.fx + w0 * 0.4, l.fy - H * 0.035], [l.fx - w0 * 0.4, l.fy - H * 0.035], i ? legCol : legColD);
    if (D1) { // chaussure, pointée dans le sens de la marche
      const sw = w0 * 1.25;
      g.fillStyle = pc(pp.shoe || '#141414'); g.beginPath();
      g.ellipse(l.fx + dir * sw * 0.18, l.fy - H * 0.018, sw * 0.62, H * 0.022, 0, 0, 7); g.fill();
    }
  });

  // ---- bas de tenue : manteau / robe / jupe
  if (longLow) {
    const hemY = sy - H * 0.25, flare = moving ? stride * H * 0.03 : 0;
    quad([shX - shW * 0.45, shY + H * 0.05], [shX + shW * 0.45, shY + H * 0.05], [cx + hipW * 0.75 + flare, hemY], [cx - hipW * 0.75 + flare, hemY], cloth);
    quad([shX - shW * 0.45, shY + H * 0.05], [shX - shW * 0.2, shY + H * 0.05], [cx - hipW * 0.4 + flare, hemY], [cx - hipW * 0.75 + flare, hemY], clothD);
    if (D2 && pp.outfit === 'coat') { seg(shX, shY + H * 0.08, cx + flare * 0.5, hemY, Math.max(1 / RES, H * 0.006), pc(pp.c, 0.6)); }
  } else if (pp.outfit === 'skirt') {
    const hemY = hipY + H * 0.17;
    quad([hipX - hipW * 0.55, hipY - H * 0.01], [hipX + hipW * 0.55, hipY - H * 0.01], [cx + hipW * 0.78, hemY], [cx - hipW * 0.78, hemY], pc(pp.bag));
  }

  // ---- torse
  let torsoCol = cloth;
  if (D1) {   // lumière du plafond : haut du buste plus clair
    torsoCol = g.createLinearGradient(0, shY, 0, hipY);
    torsoCol.addColorStop(0, pc(pp.c, 1.15)); torsoCol.addColorStop(1, pc(pp.c, 0.82));
  }
  quad([shX - shW / 2, shY], [shX + shW / 2, shY], [hipX + hipW / 2, hipY + H * 0.01], [hipX - hipW / 2, hipY + H * 0.01], torsoCol);
  if (D2) {
    g.strokeStyle = `rgba(0,0,0,${0.35 * PL_F})`; g.lineWidth = 1 / RES; g.beginPath();
    g.moveTo(shX - shW / 2, shY); g.lineTo(shX + shW / 2, shY); g.lineTo(hipX + hipW / 2, hipY + H * 0.01); g.lineTo(hipX - hipW / 2, hipY + H * 0.01); g.closePath(); g.stroke();
  }
  // face à l'ombre (lumière venant du plafond, côté quai)
  quad([shX - shW / 2, shY], [shX - shW * 0.27, shY], [hipX - hipW * 0.28, hipY + H * 0.01], [hipX - hipW / 2, hipY + H * 0.01], clothD);
  if (sus) quad([shX - shW / 2, shY], [shX + shW / 2, shY], [shX + shW * 0.42, shY + H * 0.04], [shX - shW * 0.42, shY + H * 0.04], clothD);   // épaules voûtées
  if (D2) {
    if (pp.outfit === 'suit') { // chemise + cravate
      quad([shX - shW * 0.13, shY], [shX + shW * 0.13, shY], [shX + shW * 0.02, shY + H * 0.12], [shX - shW * 0.02, shY + H * 0.12], pc('#f2f2f2'));
      quad([shX - shW * 0.03, shY + H * 0.01], [shX + shW * 0.03, shY + H * 0.01], [shX + shW * 0.045, shY + H * 0.13], [shX - shW * 0.045, shY + H * 0.13], pc(pp.bag));
    } else if (pp.outfit === 'puffer') { // matelassage
      for (let q = 1; q <= 3; q++) { const yy = shY + (hipY - shY) * q / 4; g.fillStyle = clothD; g.fillRect(LX(yy) - shW * 0.45, yy, shW * 0.9, Math.max(1 / RES, H * 0.007)); }
    } else if (pp.outfit === 'hoodie') { // poche kangourou + cordons
      g.fillStyle = clothD; g.fillRect(hipX - hipW * 0.35, hipY - H * 0.1, hipW * 0.7, H * 0.06);
      if (pp.hat !== 'hood') { seg(shX - shW * 0.08, shY + H * 0.01, shX - shW * 0.08, shY + H * 0.08, 1 / RES * 1.5, pc('#eeeeee')); seg(shX + shW * 0.08, shY + H * 0.01, shX + shW * 0.08, shY + H * 0.08, 1 / RES * 1.5, pc('#eeeeee')); }
    } else if (pp.outfit === 'coat' && D3) { // boutons
      for (let q = 0; q < 3; q++) circ(shX + shW * 0.06, shY + H * (0.08 + q * 0.07), H * 0.007, pc(pp.c, 0.5));
    } else if (pp.outfit === 'tshirt' && D3 && pp.party) { // motif
      circ(shX, shY + H * 0.1, H * 0.03, pc('#ffffff', 0.9));
    }
    if (pack) { // bretelles
      seg(shX - shW * 0.28, shY, hipX - hipW * 0.3, shY + H * 0.2, H * 0.016, pc(pp.bag, 0.6));
      seg(shX + shW * 0.28, shY, hipX + hipW * 0.3, shY + H * 0.2, H * 0.016, pc(pp.bag, 0.6));
    }
  }
  // rehaut : liseré lumineux sur les épaules
  if (D1) { g.fillStyle = `rgba(255,246,220,${0.28 * PL_F})`; g.fillRect(shX - shW / 2, shY, shW, Math.max(1 / RES, H * 0.008)); }

  // ---- bras
  const armW = H * (pp.outfit === 'puffer' ? 0.085 : 0.07);
  const sleeve = pc(pp.c), sleeveD = clothD, foreCol = pp.outfit === 'tshirt' || pp.outfit === 'dress' ? skin : sleeve;
  const arms = [-1, 1].map(s => {
    const ax = shX + s * (shW / 2 - armW * 0.35), ay = shY + armW * 0.45;
    let ex, ey, hx, hy;
    const swing = moving ? -s * stride * H * (run ? 0.16 : 0.08) : (pp.party ? Math.sin(t * 1.3 + s) * H * 0.015 : 0);
    ex = ax + s * H * 0.02 + swing * 0.5; ey = ay + H * 0.16;
    hx = ax + s * H * 0.025 + swing; hy = ay + H * 0.31;
    if (run) { ey = ay + H * 0.12; hy = ay + H * 0.2; hx = ax + swing * 1.2 + dir * H * 0.06; }
    if (sus && !moving) { ex = ax + s * H * 0.01; ey = ay + H * 0.15; hx = hipX + s * hipW * 0.25; hy = hipY - H * 0.06; }   // mains dans les poches
    if (onPhone && s === 1) { ex = ax + H * 0.02; ey = ay + H * 0.17; hx = shX + H * 0.03; hy = shY + H * 0.12; }
    if (pp.acc === 'map') { ex = ax + s * H * 0.04; ey = ay + H * 0.16; hx = shX + s * H * 0.05; hy = shY + H * 0.14; }
    if (pp.acc === 'stroller') { ex = ax + dir * H * 0.06; ey = ay + H * 0.14; hx = ax + dir * H * 0.17; hy = ay + H * 0.2; }
    if ((pp.acc === 'cane' || pp.acc === 'umbrella') && s === dir) { ex = ax + dir * H * 0.03; ey = ay + H * 0.15; hx = ax + dir * H * 0.09; hy = ay + H * 0.28; }
    if (pp.acc2 === 'suitcase' && s === -dir) { hx = ax - dir * H * 0.06; hy = ay + H * 0.3; ex = ax - dir * H * 0.03; ey = ay + H * 0.15; }
    if (pp.kid && s === -dir) { ex = ax - dir * H * 0.04; ey = ay + H * 0.15; hx = ax - dir * H * 0.11; hy = ay + H * 0.29; }   // tend la main à l'enfant
    if (kids && s === dir) { ex = ax + dir * H * 0.05; ey = ay + H * 0.1; hx = ax + dir * H * 0.12; hy = ay + H * 0.04; }      // l'enfant lève la main
    if (pp.holder && pp.st === 'door' && s === -1) { ex = ax - H * 0.07; ey = ay - H * 0.02; hx = ax - H * 0.12; hy = ay - H * 0.16; }   // retient la porte, bras levé
    return { ax, ay, ex, ey, hx, hy, s };
  });
  if (D1) arms.forEach(a => {
    const back = a.s === -1;
    limb(a.ax, a.ay, a.ex, a.ey, a.ex, a.ey, armW, back ? sleeveD : sleeve);
    limb(a.ex, a.ey, a.ex, a.ey, a.hx, a.hy, armW * 0.9, back && foreCol !== skin ? sleeveD : foreCol);
    circ(a.hx, a.hy, armW * 0.5, back ? skinD : skin);
  });
  else { g.fillStyle = clothD; g.fillRect(shX - shW / 2 - armW * 0.4, shY, armW * 0.5, H * 0.3); g.fillRect(shX + shW / 2 - armW * 0.1, shY, armW * 0.5, H * 0.3); }

  // ---- accessoires portés devant
  const hand = arms[1], handL = arms[0];
  if (D1 && pp.acc === 'handbag') {
    const bx = hipX + hipW * 0.62, by = hipY - H * 0.03, bw = H * 0.1, bh = H * 0.085;
    if (D2) seg(shX - shW * 0.2, shY + H * 0.01, bx, by, Math.max(1 / RES, H * 0.006), pc(pp.bag, 0.6));
    g.fillStyle = pc(pp.bag); g.fillRect(bx - bw / 2, by, bw, bh);
    if (D2) { g.fillStyle = pc(pp.bag, 1.3); g.fillRect(bx - bw / 2, by, bw, Math.max(1 / RES, bh * 0.15)); }
  }
  if (D1 && onPhone) {
    const ph = H * 0.05;
    g.fillStyle = '#111'; g.fillRect(hand.hx - ph * 0.3, hand.hy - ph * 0.9, ph * 0.6, ph);
    const night = PER === 2;
    if (D2) { g.fillStyle = night ? '#bfe6ff' : '#5a8ab0'; g.fillRect(hand.hx - ph * 0.22, hand.hy - ph * 0.82, ph * 0.44, ph * 0.8); }
    if (night) glow(hand.hx, hand.hy - ph * 0.4, H * 0.12, '150,200,255', 0.35);
  }
  if (D1 && pp.acc === 'map') {
    const mw = H * 0.2, mh = H * 0.12, my = shY + H * 0.08;
    g.fillStyle = pc('#f4ecd0'); g.fillRect(shX - mw / 2, my, mw, mh);
    if (D2) { g.fillStyle = pc('#7ab0d8'); g.fillRect(shX - mw * 0.3, my + mh * 0.2, mw * 0.25, mh * 0.5); g.fillStyle = pc('#8ac07a'); g.fillRect(shX + mw * 0.05, my + mh * 0.35, mw * 0.3, mh * 0.4); g.fillStyle = pc('#c0b090'); g.fillRect(shX - 1 / RES / 2, my, 1 / RES, mh); }
  }
  if (D1 && (pp.acc === 'cane' || pp.acc === 'umbrella')) {
    const h0 = arms.find(a => a.s === dir) || hand;
    const tipX = h0.hx + dir * H * (pp.acc === 'cane' ? 0.08 : 0.04);
    seg(h0.hx, h0.hy - H * 0.02, tipX, sy - H * 0.005, H * (pp.acc === 'cane' ? 0.014 : 0.03), pc(pp.acc === 'cane' ? '#5a3a22' : pp.bag));
    if (pp.acc === 'umbrella' && D2) seg(h0.hx, h0.hy - H * 0.02, h0.hx, h0.hy - H * 0.05, H * 0.012, '#222');
  }
  if (D1 && pp.acc === 'stroller') {
    const bx = cx + dir * H * 0.42, by = sy - H * 0.2, bw = H * 0.34, bh = H * 0.2;
    seg(hand.hx, hand.hy, bx - dir * bw * 0.35, by, H * 0.012, '#222');
    g.fillStyle = pc(pp.bag); g.beginPath(); g.ellipse(bx, by, bw / 2, bh / 2, 0, 0, 7); g.fill();
    g.fillStyle = pc(pp.bag, 0.7); g.beginPath(); g.ellipse(bx - dir * bw * 0.12, by - bh * 0.25, bw * 0.38, bh * 0.55, 0, Math.PI, 2 * Math.PI); g.fill();
    seg(bx - bw * 0.3, by + bh * 0.4, bx - bw * 0.3, sy - H * 0.04, H * 0.01, '#222'); seg(bx + bw * 0.3, by + bh * 0.4, bx + bw * 0.3, sy - H * 0.04, H * 0.01, '#222');
    circ(bx - bw * 0.3, sy - H * 0.03, H * 0.03, '#151515'); circ(bx + bw * 0.3, sy - H * 0.03, H * 0.03, '#151515');
  }

  // ---- cou + tête
  g.fillStyle = skinD; g.fillRect(headX - headR * 0.35, headY + headR * 0.6, headR * 0.7, shY - headY - headR * 0.5);
  if (D1 && pp.scarf && pp.hat !== 'hood') {   // écharpe enroulée + pan qui tombe
    const sc = pc(pp.scarf), scD = pc(pp.scarf, 0.75);
    g.fillStyle = sc; g.beginPath(); g.ellipse(headX, shY - H * 0.005, shW * 0.3, H * 0.022, 0, 0, 7); g.fill();
    quad([headX + dir * shW * 0.05, shY], [headX + dir * shW * 0.17, shY], [headX + dir * shW * 0.15, shY + H * 0.13], [headX + dir * shW * 0.04, shY + H * 0.12], scD);
  }
  const hcol0 = pc(pp.hair);
  if (D1 && pp.hat !== 'hood' && !pp.hat) {   // volumes de coiffure derrière la tête
    if (pp.hairStyle === 'afro') circ(headX, headY - headR * 0.2, headR * 1.38, hcol0);
    if (pp.hairStyle === 'pony') { g.fillStyle = hcol0; g.beginPath(); g.ellipse(headX - dir * headR * 1.05, headY + headR * 0.2, headR * 0.35, headR * 0.75, -dir * 0.4, 0, 7); g.fill(); }
  }

  if (pp.hat === 'hood') {   // visage dans l'ombre de la capuche
    g.fillStyle = pc(pp.c, 0.85); g.beginPath(); g.arc(headX, headY - headR * 0.05, headR * 1.32, Math.PI * 1.05, Math.PI * 1.95); g.lineTo(headX, headY - headR * 0.2); g.fill();

    else { g.fillStyle = hcol; g.beginPath(); g.arc(headX, headY, headR * 1.03, Math.PI * 0.85, Math.PI * 1.1); g.arc(headX, headY, headR * 1.03, Math.PI * 1.9, Math.PI * 2.15); g.fill(); }

  }

}

// personne en fauteuil roulant (vue de profil)
function drawWheelchair(sx, sy, sc, pp, t, D1, D2, D3) {
  const H = 1.7 * sc, dir = pp.dir || 1;
  const wr = H * 0.19, wx = sx - dir * H * 0.05, wy = sy - wr;
  const seatY = sy - H * 0.3, skin = pc(pp.k);
  g.fillStyle = `rgba(0,0,0,${0.28 * PL_F})`; g.beginPath(); g.ellipse(sx, sy, H * 0.25, H * 0.05, 0, 0, 7); g.fill();
  // dossier + assise
  seg(wx - dir * H * 0.1, seatY, wx - dir * H * 0.12, seatY - H * 0.28, H * 0.025, '#2a2d34');
  seg(wx - dir * H * 0.12, seatY - H * 0.28, wx - dir * H * 0.2, seatY - H * 0.28, H * 0.02, '#2a2d34');
  // corps assis
  const shY = seatY - H * 0.3, hipX = wx - dir * H * 0.02;
  const breathe = Math.sin(t * 1.7) * H * 0.004;
  quad([hipX - H * 0.08, shY + breathe], [hipX + H * 0.08, shY + breathe], [hipX + H * 0.07, seatY], [hipX - H * 0.07, seatY], pc(pp.c));
  // cuisses + jambes
  limb(hipX, seatY - H * 0.03, hipX + dir * H * 0.2, seatY - H * 0.03, hipX + dir * H * 0.22, sy - H * 0.06, H * 0.07, pc(pp.pants));

  // roue

  if (D2) { g.lineWidth = Math.max(0.5 / RES, H * 0.005); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4 + (pp._lw || 0) * 0.3; g.beginPath(); g.moveTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr); g.lineTo(wx - Math.cos(a) * wr, wy - Math.sin(a) * wr); g.stroke(); } }
  circ(wx + dir * H * 0.24, sy - H * 0.03, H * 0.03, '#2a2d34');
  // bras sur la main courante
  limb(hipX, shY + H * 0.04, hipX + dir * H * 0.05, shY + H * 0.16, wx + dir * wr * 0.4, wy - wr * 0.6, H * 0.06, pc(pp.c, 0.85));
  // tête
  const hr = H * 0.068, hx = hipX + dir * H * 0.01, hy = shY - hr * 1.2;

  if (D1) { g.fillStyle = pc(pp.hair); g.beginPath(); g.arc(hx, hy - hr * 0.02, hr * 1.04, Math.PI * 0.95, Math.PI * 2.05); g.fill(); }
  if (D3) { const er = Math.max(0.6 / RES, hr * 0.11); circ(hx - hr * 0.3 + dir * hr * 0.25, hy + hr * 0.05, er, '#1a1410'); circ(hx + hr * 0.3 + dir * hr * 0.25, hy + hr * 0.05, er, '#1a1410'); }
  if (D2 && pp.acc === 'headphones') { g.strokeStyle = '#1a1a1a'; g.lineWidth = Math.max(1 / RES, hr * 0.22); g.beginPath(); g.arc(hx, hy, hr * 1.12, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); }
  return { hand: [wx + dir * wr * 0.4, wy - wr * 0.6], top: hy - hr };
}

function drawScene() {
  g.save();
  g.beginPath(); g.rect(0, 0, W, VIEW_H); g.clip();
  g.fillStyle = '#050507'; g.fillRect(0, 0, W, VIEW_H);
  CY = 72 + Math.round(Math.sin(S.t * 23) * Math.min(1, S.v / 14));
  // murs de fin de station vus depuis le quai
  STATIONS.forEach(s => {
    const d = s.pos + PE - S.pos;
    if (d > NEAR && d < DMAX) {
      const f = Math.max(0.35, 1 - d / 260);
      poly(ST_PROF.map(([x, y]) => [x, y, d]), sh(C.endWall, f));
    }
  });
  BZ = null;
  if (false) {
    const sp = STATIONS[S.next].pos, bd = S.v * S.v / (2 * 2.0);
    const inZone = sp - S.pos <= bd + 0.5;
    BZ = { from: sp - bd, to: sp, col: inZone ? [230, 70, 50] : [230, 140, 40], inZone };
  }
  const sprites = collectSprites(); let si = 0;
  const pTop = Math.floor((S.pos + DMAX) / STEP) * STEP;
  for (let p1 = pTop; p1 - S.pos > NEAR; p1 -= STEP) {
    const p0 = p1 - STEP;
    const d1 = p1 - S.pos + 0.12, d0 = Math.max(p0 - S.pos, NEAR);
    const s = stationAt((p0 + p1) / 2);
    if (s) { FOG = FOG_ST; stationSlice(s, p0, d0, d1, Math.max(0.35, 1 - d0 / 260)); }
    else { FOG = FOG_TUN; tunnelSlice(p0, d0, d1, Math.max(0.06, 1 - d0 / 150)); }
    while (si < sprites.length && sprites[si].d >= d0) { sprites[si].draw(sprites[si].d); si++; }

// 0 = libre, 1 = voyageur qui approche, 2 = voyageur dans la porte
function doorState(dz) {
  let s = 0;
  for (const m of S.mp) {
    if (m.delay > 0 || m.door !== dz) continue;
    if (m.st === 'door' || (m.st === 'out' && m.delay <= 0)) return 2;
    if (m.st === 'out') s = Math.max(s, 1);
    if (m.st === 'walk' && Math.hypot(m.z - dz, m.x) < 3.5) s = 1;
  }
  return s;
}

function drawCab() {

  // montants du pare-brise (métal sombre avec arête éclairée)
  const pil = g.createLinearGradient(0, 0, 24, 0);
  pil.addColorStop(0, '#0d0e12'); pil.addColorStop(0.8, '#1c1e26'); pil.addColorStop(1, '#2a2d38');
  g.fillStyle = pil;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(24, 0); g.lineTo(12, VIEW_H); g.lineTo(0, VIEW_H); g.fill();
  const pir = g.createLinearGradient(W, 0, W - 24, 0);
  pir.addColorStop(0, '#0d0e12'); pir.addColorStop(0.8, '#1c1e26'); pir.addColorStop(1, '#2a2d38');
  g.fillStyle = pir;
  g.beginPath(); g.moveTo(W, 0); g.lineTo(W - 24, 0); g.lineTo(W - 12, VIEW_H); g.lineTo(W, VIEW_H); g.fill();
  g.fillStyle = '#14151b'; g.fillRect(0, 0, W, 6);
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(0, 5.5, W, 0.5);
  // ---- console de cabine : plastique sombre mat, rebord caoutchouc, instruments encastrés
  const running = S.mode === 'running', atStation = running && S.phase !== 'drive';
  const kmh = Math.round(S.v * 3.6);
  const C0 = VIEW_H, SANS = '"Helvetica Neue", Arial, sans-serif';
  const dk = g.createLinearGradient(0, C0, 0, H);
  dk.addColorStop(0, '#2b2f37'); dk.addColorStop(0.25, '#22252c'); dk.addColorStop(1, '#14161b');
  g.fillStyle = dk; g.fillRect(0, C0, W, H - C0);
  g.fillStyle = '#0c0d10'; g.fillRect(0, C0, W, 3);                          // rebord (caoutchouc)
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, C0 + 3, W, 0.6);    // arête éclairée
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${0.012 + (i % 3) * 0.006})`; g.fillRect((i * 97) % W, C0 + 5 + (i * 13) % 30, 0.6, 0.6); }   // grain
  drawConsoleWear(C0);
  const sans = (t, x, y, sz, col, al = 'left', w = 0, bold = false) => {
    g.font = `${bold ? 'bold ' : ''}${sz}px ${SANS}`; g.textAlign = al; g.fillStyle = col;
    if (w) while (sz > 4 && g.measureText(t).width > w) { sz -= 0.5; g.font = `${bold ? 'bold ' : ''}${sz}px ${SANS}`; }
    g.fillText(t, x, y);
  };
  const IY = C0 + 4, IH = 30, cy = IY + IH / 2;   // zone des instruments

  // compteur rond à lunette chromée (0–80 km/h sur 270°)
  const gx0 = 32, gy0 = cy + 1, R = 13.5, ang = v => Math.PI * 0.75 + Math.PI * 1.5 * Math.min(80, Math.max(0, v)) / 80;
  const bez = g.createLinearGradient(gx0 - R, gy0 - R, gx0 + R, gy0 + R); bez.addColorStop(0, '#d8dde6'); bez.addColorStop(0.5, '#5d636e'); bez.addColorStop(1, '#a8afba');
  g.fillStyle = bez; g.beginPath(); g.arc(gx0, gy0, R + 1.6, 0, 7); g.fill();
  g.fillStyle = '#07080b'; g.beginPath(); g.arc(gx0, gy0, R, 0, 7); g.fill();
  g.strokeStyle = '#7a2a22'; g.lineWidth = 1.6; g.beginPath(); g.arc(gx0, gy0, R - 1.6, ang(60), ang(80)); g.stroke();
  for (let v = 0; v <= 80; v += 10) {
    const a = ang(v), r1 = R - (v % 20 ? 2.5 : 3.8);
    g.strokeStyle = '#e6e9ef'; g.lineWidth = v % 20 ? 0.5 : 0.9;
    g.beginPath(); g.moveTo(gx0 + Math.cos(a) * r1, gy0 + Math.sin(a) * r1); g.lineTo(gx0 + Math.cos(a) * (R - 0.6), gy0 + Math.sin(a) * (R - 0.6)); g.stroke();
    if (v % 20 === 0) sans(String(v), gx0 + Math.cos(a) * (R - 7), gy0 + Math.sin(a) * (R - 7) + 1.5, 4, '#9aa1ae', 'center');
  }
  const mark = (v, c) => { const a = ang(v); g.strokeStyle = c; g.lineWidth = 1.4; g.beginPath(); g.moveTo(gx0 + Math.cos(a) * (R - 4.5), gy0 + Math.sin(a) * (R - 4.5)); g.lineTo(gx0 + Math.cos(a) * (R + 1.4), gy0 + Math.sin(a) * (R + 1.4)); g.stroke(); };
  if (running && S.phase === 'drive' && S.vperm < VMAX) mark(S.vperm * 3.6, '#4fc8ff');
  if (S.limit) mark(S.limit, '#ffb35e');
  sans(String(kmh), gx0, gy0 + 8.5, 5.5, '#ffd75e', 'center', 0, true);
  const na = ang(S.v * 3.6);
  g.strokeStyle = '#ff7a2a'; g.lineWidth = 1.2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(gx0 - Math.cos(na) * 2.5, gy0 - Math.sin(na) * 2.5); g.lineTo(gx0 + Math.cos(na) * (R - 2), gy0 + Math.sin(na) * (R - 2)); g.stroke(); g.lineCap = 'butt';
  g.fillStyle = '#3a3e48'; g.beginPath(); g.arc(gx0, gy0, 1.8, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.07)'; g.beginPath(); g.ellipse(gx0 - 3, gy0 - 5, 8, 4, -0.5, 0, 7); g.fill();   // reflet du verre
  if (S.limit) {   // panneau de limitation (travaux)
    const over = kmh > S.limit + 1;
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(gx0 + 19, IY + 5, 5, 0, 7); g.fill();
    g.strokeStyle = '#d42a2a'; g.lineWidth = 1.2; g.beginPath(); g.arc(gx0 + 19, IY + 5, 4.4, 0, 7); g.stroke();
    sans(String(S.limit), gx0 + 19, IY + 7, 4.5, over && Math.floor(S.t * 6) % 2 ? '#d42a2a' : '#111', 'center', 0, true);
  }

  // écran de bord : dalle anthracite faiblement rétroéclairée, texte ambre et blanc cassé
  const sx0 = 62, sw = 138, AMB = '#ffb547', OFF = '#e6dfcc', DIM = '#9c947e';
  // cadre épais biseauté (clair en haut à gauche, sombre en bas à droite) et deux vis
  const bx0 = sx0 - 5, by0 = IY - 3, bw = sw + 10, bh = IH + 6;
  const bz = g.createLinearGradient(bx0, by0, bx0 + bw * 0.3, by0 + bh); bz.addColorStop(0, '#4a4e57'); bz.addColorStop(0.5, '#2c3038'); bz.addColorStop(1, '#16181d');
  g.fillStyle = bz; g.fillRect(bx0, by0, bw, bh);
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(bx0, by0, bw, 0.6); g.fillRect(bx0, by0, 0.6, bh);
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(bx0, by0 + bh - 0.6, bw, 0.6); g.fillRect(bx0 + bw - 0.6, by0, 0.6, bh);
  g.fillStyle = '#050608'; g.fillRect(sx0 - 1.2, IY - 0.2, sw + 2.4, IH + 0.4);       // feuillure
  for (const vx of [sx0 - 2.6, sx0 + sw + 2.6]) {
    const vg = g.createRadialGradient(vx - 0.4, cy - 0.4, 0.1, vx, cy, 1.3); vg.addColorStop(0, '#8a8e96'); vg.addColorStop(1, '#2a2d33');
    g.fillStyle = vg; g.beginPath(); g.arc(vx, cy, 1.3, 0, 7); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 0.35; g.beginPath(); g.moveTo(vx - 0.9, cy + 0.5); g.lineTo(vx + 0.9, cy - 0.5); g.stroke();
  }
  const lcd = g.createLinearGradient(0, IY, 0, IY + IH); lcd.addColorStop(0, '#11171c'); lcd.addColorStop(1, '#0a0e12');
  g.fillStyle = lcd; g.fillRect(sx0, IY + 1, sw, IH - 2);
  glow(sx0 + sw / 2, IY + IH / 2, 40, '255,190,120', 0.035);                            // rétroéclairage faible
  sans(fmt(S.clock), sx0 + 5, IY + 11, 8, OFF, 'left', 0, true);
  if (atStation) {
    // ligne 1 : quand partir
    const st0 = STATIONS[S.cur];
    if (S.next < STATIONS.length) {
      const toDep = Math.ceil(st0.dep - S.clock), fc = departForecast(), bl = Math.floor(S.t * 4) % 2;
      const [l, c] = toDep > 0 ? [`départ dans ${toDep} s`, '#7dff8a'] : fc <= 0 ? [`partez ! marge ${Math.max(0, Math.floor(-fc))} s`, bl ? OFF : AMB] : [`retard prévu +${Math.ceil(fc)} s`, bl ? '#ff8a7a' : '#ffc0b8'];
      sans(l, sx0 + sw - 4, IY + 11, 6.5, c, 'right', 90, true);
    } else sans('terminus', sx0 + sw - 4, IY + 11, 6.5, DIM, 'right');
    // ligne 2 : remplissage de la rame (5 voitures)
    const ratio = S.load / CAP, full = S.load >= CAP;
    sans('RAME', sx0 + 5, IY + 23.5, 5.5, DIM);
    for (let c = 0; c < 5; c++) {
      const fill = Math.min(1, S.cars[c] / CAR_CAP), bx = sx0 + 24 + c * 11;
      g.fillStyle = '#1a1f24'; g.fillRect(bx, IY + 16, 9, 9);
      g.fillStyle = fill >= 1 ? '#ff4a3a' : fill > 0.85 ? '#ffb35e' : fill > 0.6 ? '#ffd75e' : '#7dff8a'; g.fillRect(bx, IY + 16 + 9 * (1 - fill), 9, 9 * fill);
    }
    sans(full ? 'PLEINE' : `${Math.round(ratio * 100)} % · ${Math.max(0, CAP - S.load)} libres`, sx0 + sw - 4, IY + 23.5, 6, full ? '#ff8a7a' : OFF, 'right');
  } else {
  if (S.missed > 0) sans(`arrêts ratés ${S.missed}/${MISS_MAX}`, sx0 + sw - 4, IY + 10, 5.5, S.missed >= MISS_MAX - 1 ? '#ff8a7a' : '#ffc27a', 'right');
  if (S.next < STATIONS.length) {
    const n = STATIONS[S.next], Ln = LN();
    g.fillStyle = Ln.col; g.beginPath(); g.arc(sx0 + 9, IY + 21, 4.6, 0, 7); g.fill();
    sans(Ln.num, sx0 + 9, IY + 23.2, Ln.num.length > 1 ? 4.5 : 6, Ln.fg, 'center', 0, true);
    sans(n.name, sx0 + 17, IY + 23.5, 7, AMB, 'left', sw - 58, true);
    sans('arr. ' + fmt(n.arr), sx0 + sw - 4, IY + 23.5, 6.5, S.entryDelta !== null ? DIM : schedState(S.schedShow)[1], 'right');
  } else sans('Terminus', sx0 + 17, IY + 23.5, 7, AMB, 'left', 0, true);
  }

  // vitre de l'écran : légèrement dépolie, reflet oblique discret, poussière
  g.fillStyle = 'rgba(190,195,200,0.035)'; g.fillRect(sx0, IY + 1, sw, IH - 2);
  g.save(); g.beginPath(); g.rect(sx0, IY + 1, sw, IH - 2); g.clip();
  const rf = g.createLinearGradient(sx0 + 20, IY, sx0 + 60, IY + IH); rf.addColorStop(0, 'rgba(255,255,255,0)'); rf.addColorStop(0.5, 'rgba(255,250,240,0.045)'); rf.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rf; g.fillRect(sx0, IY, sw, IH);
  g.restore();
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(220,215,200,${0.08 + 0.12 * hsh(i, 47)})`; g.fillRect(sx0 + hsh(i, 45) * sw, IY + 1 + hsh(i, 46) * (IH - 2), 0.5, 0.5); }
  // traces de doigts sur l'écran de bord, poussière sur le verre du compteur
  for (const [x, y, r] of [[sx0 + 30, IY + 20, 5], [sx0 + 92, IY + 9, 4], [sx0 + 118, IY + 22, 6]]) {
    const fp = g.createRadialGradient(x, y, 0, x, y, r); fp.addColorStop(0, 'rgba(255,255,255,0.06)'); fp.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = fp; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 12; i++) { g.fillStyle = 'rgba(220,215,200,0.18)'; g.fillRect(gx0 - R + hsh(i, 41) * 2 * R, gy0 - R + hsh(i, 42) * 2 * R, 0.5, 0.5); }
  // boutons lumineux : portes, sonnerie, klaxon, veille
  const mute = (col, k = 0.4) => {   // désature et assombrit une couleur de lampe
    const c = [1, 3, 5].map(i => parseInt(col.slice(i, i + 2), 16)), l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2];
    return '#' + c.map(v => Math.round((v + (l - v) * k) * 0.85).toString(16).padStart(2, '0')).join('');
  };
  const btn = (x, label, lit, col) => {
    col = mute(col);
    g.fillStyle = '#0a0b0e'; g.beginPath(); g.arc(x, cy - 2, 5.6, 0, 7); g.fill();
    const bg = g.createRadialGradient(x - 1.2, cy - 3.2, 0.5, x, cy - 2, 4.6);
    bg.addColorStop(0, lit ? '#ffffff' : '#5a5f6a'); bg.addColorStop(0.4, lit ? col : '#2e323b'); bg.addColorStop(1, lit ? col : '#1d2027');
    g.fillStyle = bg; g.beginPath(); g.arc(x, cy - 2, 4.6, 0, 7); g.fill();
    if (lit) { const rgb = [1, 3, 5].map(i => parseInt(col.slice(i, i + 2), 16)).join(','); glow(x, cy - 2, 11, rgb, 0.3); }
    sans(label, x, cy + 11, 4.2, '#9aa1ae', 'center');
  };
  const blink = Math.floor(S.t * 6) % 2;
  // à quai (et juste après la fermeture) : bloc « portes », dans l'ordre de la manœuvre
  const justClosed = S.phase === 'drive' && S.v < 0.3 && S.next < STATIONS.length && S.pos - STATIONS[S.cur].pos < 1;
  if (running && (atStation || justClosed)) {
    const busy = S.mp.some(m => (m.delay <= 0 && m.st === 'door') || m.st === 'out');
    const step = S.phase === 'dwell' ? 'P' : S.phase === 'alert' ? '⏎' : justClosed ? 'Z' : '';
    const urgent = S.phase === 'dwell' && S.next < STATIONS.length && S.clock >= STATIONS[S.cur].dep - 4;
    const pulse = 0.5 + 0.5 * Math.sin(S.t * (urgent || step === 'Z' ? 10 : 5));
    const big = (x, key, label, col, active, wait) => {
      const r = 6.8, y = cy - 3;
      g.fillStyle = '#0a0b0e'; g.beginPath(); g.arc(x, y, r + 1.2, 0, 7); g.fill();
      const lit = active ? 0.55 + 0.45 * pulse : 0;
      const bg = g.createRadialGradient(x - 1.5, y - 1.5, 0.5, x, y, r);
      bg.addColorStop(0, active ? '#ffffff' : '#5a5f6a'); bg.addColorStop(0.45, active ? col : wait ? '#5a4a20' : '#2e323b'); bg.addColorStop(1, active ? col : '#1d2027');
      g.globalAlpha = active ? 0.6 + 0.4 * lit : 1; g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.globalAlpha = 1;
      if (active) { const rgb = [1, 3, 5].map(i => parseInt(col.slice(i, i + 2), 16)).join(','); glow(x, y, 15 + 6 * pulse, rgb, 0.35 + 0.35 * pulse); }
      sans(key, x, y + 2.3, 6.5, active ? '#111' : '#7d8290', 'center', 0, true);
      sans(label, x, cy + 12, 4.4, active ? '#ffffff' : '#8a909c', 'center', 0, active);
    };
    big(216, 'P', 'SONNERIE', '#ffd75e', step === 'P', false);
    big(244, '⏎', busy && S.phase === 'alert' ? 'ATTENDEZ' : 'FERMETURE', '#ff9a3a', step === '⏎' && !busy, step === '⏎' && busy);
    big(272, 'Z', 'DÉPART', '#7dff8a', step === 'Z', false);
    // voyant PORTES : rouge ouvertes, orange en fermeture, vert verrouillées
    const dc = mute(S.doors <= 0 ? '#3dff6a' : S.phase === 'closing' ? (blink ? '#ffb35e' : '#7a4a10') : '#ff3a2a', 0.25);
    g.fillStyle = '#0a0b0e'; g.fillRect(285, cy - 9, 12, 12);
    g.fillStyle = dc; g.fillRect(286.5, cy - 7.5, 9, 9);
    glow(291, cy - 3, 9, [1, 3, 5].map(i => parseInt(dc.slice(i, i + 2), 16)).join(','), 0.3);
    sans('PORTES', 291, cy + 12, 4.2, '#8a909c', 'center');
  } else {
  btn(214, 'PORTES', S.doors <= 0, '#3dff6a');
  btn(238, 'SONN.', S.buzzT > 0, '#ffd75e');
  btn(262, 'KLAXON', (S.hornT || 0) > 0, '#e6ecf5');
  btn(286, 'VEILLE', S.vacAlert > 0 && blink, '#ff9a3a');
  }

  // manette de traction / freinage (visuelle : suit l'accélérateur et le frein)
  const mx = 320, mt = IY + 2, mb = IY + IH - 2, mm = (mt + mb) / 2;
  g.fillStyle = '#0a0b0e'; g.fillRect(mx - 2, mt, 4, mb - mt);                      // fente
  for (let i = -3; i <= 3; i++) { g.fillStyle = i === 0 ? '#cfd6e6' : '#5a5f6a'; g.fillRect(mx + 4, mm + i * 3.8 - 0.3, i === 0 ? 5 : 3, 0.6); }
  sans('T', mx + 12, mt + 4, 4.5, mute('#7dff8a', 0.5)); sans('F', mx + 12, mb, 4.5, mute('#ff8a7a', 0.5));
  const lev = keyBrake() ? S.brakeF : keyTraction() && S.phase === 'drive' ? -1 : 0;   // −1 traction (vers l'avant), +1 frein
  const hy = mm + lev * (mb - mt) / 2 * 0.85;
  g.strokeStyle = '#7a808c'; g.lineWidth = 2; g.beginPath(); g.moveTo(mx, mm); g.lineTo(mx, hy); g.stroke();
  const kg = g.createRadialGradient(mx - 1.5, hy - 1.5, 0.5, mx, hy, 5); kg.addColorStop(0, '#5a5f6a'); kg.addColorStop(1, '#14161b');
  g.fillStyle = kg; g.beginPath(); g.ellipse(mx, hy, 6, 3.6, 0, 0, 7); g.fill();
  g.fillStyle = lev < 0 ? mute('#3dff6a') : lev > 0 ? mute('#ff6b5b') : '#9aa1ae'; g.fillRect(mx - 2.5, hy - 0.5, 5, 1);

  // radio (combiné) et voyants divers
  g.fillStyle = '#0d0e12'; g.fillRect(346, IY + 3, 30, IH - 6);
  g.fillStyle = '#1c1f26'; g.fillRect(348, IY + 5, 26, 10);
  g.fillStyle = S.radio > 0 || (S.radioT > 84) ? mute('#3dff6a') : '#1e2a22'; g.fillRect(350, IY + 7, 22, 6);
  sans('RADIO', 361, IY + 22, 4.5, '#9aa1ae', 'center');
  // éclairage de cabine : légère teinte chaude commune à toute la console
  const wl = g.createLinearGradient(0, C0, 0, H); wl.addColorStop(0, 'rgba(255,175,105,0.07)'); wl.addColorStop(1, 'rgba(255,160,90,0.025)');
  g.fillStyle = wl; g.fillRect(0, C0, W, H - C0);
  // bandeau à LED pour les consignes (voir drawHint) : emplacement encastré
  g.fillStyle = '#050506'; g.fillRect(6, H - 11, W - 12, 10);

}

const BRAKE_MAX = 3.0;   // décélération du frein serré à fond (m/s²)
const BRAKE_REF = 1.8;   // décélération de référence (m/s²), le frein max est 2,4
function targetKmh(dist) { return Math.sqrt(2 * BRAKE_REF * Math.max(0, dist - 0.2)) * 3.6; }
// graphe distance (100 m → marque) / vitesse : zone verte = vitesse idéale pour s'arrêter pile, trace du conducteur
const CURVE_D = 130, CURVE_V = 70;
// point où il faut commencer à freiner pour la vitesse actuelle (là où elle croise la courbe idéale)
const brakePoint = kmh => (kmh / 3.6) ** 2 / (2 * BRAKE_REF) + 0.2;
function drawCurve(x, y, w, h, trace, band, nowDist, light = false) {
  const L = 13, B = 7;                                   // marges : graduations vitesse (gauche) et distance (bas)
  const gx = x + L, gw = w - L - 3, gy = y + 2, gh = h - B - 2;
  const X = d => gx + gw * (1 - Math.max(-3, Math.min(CURVE_D, d)) / CURVE_D) * 0.96;
  const Y = v => gy + gh - gh * Math.max(0, Math.min(CURVE_V, v)) / CURVE_V;
  g.fillStyle = light ? 'rgba(8,10,14,0.55)' : 'rgba(8,10,14,0.9)'; g.fillRect(x, y, w, h);
  // grille et graduations
  if (!light) for (const v of [10, 20, 30, 40, 50, 60, 70]) {
    g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(gx, Y(v), gw, 0.5);
    if (v % 20 === 0) txt(String(v), x + L - 2, Y(v) + 2.5, 7, '#7f8aa0', 'right');
  }
  if (!light) for (const d of [100, 75, 50, 25, 10]) {
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(X(d), gy, 0.5, gh);
    txt(String(d), X(d), y + h - 1, 7, '#7f8aa0', 'center');
  }
  g.fillStyle = '#d42a2a'; g.fillRect(X(0) - 0.5, gy, 1, gh);
  txt('STOP', X(0), y + h - 1, 6, '#ff6b5b', 'center');
  // zones : trop vite (rouge) au-dessus de la courbe, vitesse idéale (vert) juste en dessous
  if (band > 0) {
    g.globalAlpha = band;
    const pts = []; for (let d = CURVE_D; d >= 0; d -= 1) pts.push(d);
    g.fillStyle = 'rgba(150,44,34,0.45)'; g.beginPath(); g.moveTo(X(CURVE_D), gy);
    pts.forEach(d => g.lineTo(X(d), Y(targetKmh(d)))); g.lineTo(X(0), gy); g.fill();
    g.fillStyle = 'rgba(47,150,74,0.55)'; g.beginPath();
    pts.forEach((d, i) => i ? g.lineTo(X(d), Y(targetKmh(d))) : g.moveTo(X(d), Y(targetKmh(d))));
    for (let i = pts.length - 1; i >= 0; i--) g.lineTo(X(pts[i]), Y(Math.max(0, targetKmh(pts[i]) - 8)));
    g.fill();
    g.strokeStyle = '#7dff8a'; g.lineWidth = 0.8; g.beginPath();                       // bord de la courbe idéale
    pts.forEach((d, i) => i ? g.lineTo(X(d), Y(targetKmh(d))) : g.moveTo(X(d), Y(targetKmh(d)))); g.stroke();
    // repère « freinez ici » pour la vitesse actuelle

  const text = group.map(m => m.text).join('  ·  ');
  const a = Math.min(1, (last.life - last.t) * 2, last.t * 8);
  g.globalAlpha = a;
  const maxW = W - 60;
  let size = 14; g.font = `${size}px VT323, monospace`;
  while (size > 9 && g.measureText(text).width > maxW - 12) { size--; g.font = `${size}px VT323, monospace`; }
  const w = Math.min(maxW, g.measureText(text).width + 12);
  const cx = W / 2, y0 = cctv ? CAM_Y0 + CAM_H - 5 : drive ? 40 : 14;
  g.fillStyle = 'rgba(6,8,14,0.82)'; g.fillRect(Math.round(cx - w / 2), y0, Math.round(w), 14);
  g.fillStyle = last.col; g.fillRect(Math.round(cx - w / 2), y0, 2, 14);
  txt(text, cx, y0 + 11, size, last.col, 'center', 'VT323', maxW - 12);
  g.globalAlpha = 1;
}

function drawHelp() {
  g.fillStyle = 'rgba(4,6,12,0.95)'; g.fillRect(0, 0, W, H);
  txt('AIDE — jeu en pause', W / 2, 13, 9, '#ffd75e', 'center', '"Press Start 2P"');
  const col = (x, y, title, lines) => {
    txt(title, x, y, 12, '#ffd75e');
    lines.forEach((l, i) => {
      const [c, t] = Array.isArray(l) ? l : ['#e6ecf5', l];
      if (c.startsWith('#') && t.startsWith('■')) { g.fillStyle = c; g.fillRect(x, y + 6 + i * 10, 6, 6); txt(t.slice(1), x + 9, y + 12 + i * 10, 10, '#e6ecf5', 'left', 'VT323', 178); }
      else txt(t, x, y + 12 + i * 10, 10, c, 'left', 'VT323', 182);
    });
  };
  col(10, 28, 'LE BUT', [
    'Chaque station vaut 3 étoiles :',
    ['#ffd75e', '★ arrêt à moins de 1,5 m de la marque'],
    ['#ffd75e', '★ entrée à quai à ±2 s de l\'heure'],
    ['#ffd75e', '★ quai vidé (personne ne reste)'],
    '+5 par voyageur monté, −5 par voyageur laissé,',
    '−10 par seconde d\'écart à l\'arrivée : attendre ou partir ?',
    '🛡 Sécurité : chaque faute enlève des points.',
    `Médailles : bronze ${MEDALS[0][0]} · argent ${MEDALS[1][0]} · or ${MEDALS[2][0]}`,
  ]);
  col(198, 28, 'CAMÉRAS DE QUAI', [
    ['#3dff6a', '■porte libre'],
    ['#ffb35e', '■voyageur qui approche de la porte'],
    ['#ff2a2a', '■porte occupée : ne fermez pas !'],
    'Pastille en coin : pire état des 2 portes.',
    'Barre près de CAM : remplissage de la voiture.',
    'Carré rouge sur un voyageur : il ne peut plus',
    'monter (voiture pleine ou sonnerie passée).',
  ]);
  col(10, 122, 'EN CONDUITE', [
    'Cadran : curseur blanc = votre vitesse,',
    'zone verte = vitesse idéale pour s\'arrêter pile.',
    'Panneaux 50 / 25 / 10 : mètres avant la marque.',
    'Z : accélérer. S : freiner (serre en 0,5 s ;',
    'petite touche = petit freinage).',
    'Bips de plus en plus rapides : marque toute proche.',
    ['#4fc8ff', 'HORAIRE (en haut) : bleu avance, rouge retard.'],
    ['#ffb35e', 'Repère orange : limitation travaux.'],
    ['#4fc8ff', 'En avance ? Le train devant vous ralentit (bleu).'],
  ]);
  col(198, 122, 'ACTIONS', [
    'A : radio — porte retenue, individu louche',
    '      (capuche) à bord ; alarme en cas de vol.',
    'V puis 1/2 : annonces (répartir, portes).',
    'Plan de ligne : voyageurs en attente ; moins',
    'de saturation = bonus en fin de service.',
    'K : klaxon (personne sur la voie).',
    'Espace : veille automatique (quand elle sonne).',
    'M : missions   H : signaler les louches',
  ]);
  txt('GAME OVER si : voyageur percuté · collision avec le train devant · 3 arrêts ratés · trafic à 100 %', W / 2, 203, 9, '#ff8a7a', 'center', 'VT323', W - 16);
  txt('? ou Échap : reprendre', W / 2, 212, 9, '#8fa0b8', 'center');
}
function keycap(x, y, label, w = 12) {
  g.fillStyle = '#d8dce4'; g.fillRect(x, y, w, 12);
  g.fillStyle = '#9aa1ae'; g.fillRect(x, y + 10, w, 2);
  txt(label, x + w / 2, y + 9, 11, '#111', 'center');
}
function drawTitle() {
  // assombrissement en dégradé (le tunnel défile derrière)
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgba(4,6,12,0.92)'); gr.addColorStop(0.35, 'rgba(4,6,12,0.55)'); gr.addColorStop(0.6, 'rgba(4,6,12,0.7)'); gr.addColorStop(1, 'rgba(4,6,12,0.97)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // logo
  const bob = Math.round(Math.sin(S.t * 2) * 1);
  g.fillStyle = '#ffcd00'; g.beginPath(); g.arc(46, 24 + bob, 12, 0, 7); g.fill();
  txt('M', 46, 31 + bob, 16, '#111', 'center', '"Press Start 2P"');
  g.font = '18px "Press Start 2P", monospace'; g.textAlign = 'left';
  const title = 'DERNIER METRO', tx = 66, ty = 33 + bob;
  g.fillStyle = '#000'; g.fillText(title, tx + 2, ty + 2);
  g.fillStyle = '#ffd75e'; g.fillText(title, tx, ty);
  const eX = tx + g.measureText('DERNIER M').width, eW = g.measureText('E').width;   // accent du É
  g.fillStyle = '#000'; g.fillRect(eX + eW * 0.45 + 2, ty - 21 + 2, 5, 3);
  g.fillStyle = '#ffd75e'; g.fillRect(eX + eW * 0.45, ty - 21, 5, 3);
  txt('Transportez un maximum de voyageurs, à l\'heure, en vous arrêtant pile sur la marque.', W / 2 + 14, 48, 11, '#e6ecf5', 'center', 'VT323', 320);
  // cartes de ligne : numéro, nom, difficulté — rien d'autre
  LINES.forEach((Ln, i) => {
    const w = 86, h = 32, x = 10 + i * 92, y = 66, sel = i === LINE;
    if (sel) { g.fillStyle = Ln.col; g.fillRect(x - 2, y - 2, w + 4, h + 4); }
    g.fillStyle = sel ? '#1d2a4f' : 'rgba(29,42,79,0.45)'; g.fillRect(x, y, w, h);
    g.fillStyle = Ln.col; g.beginPath(); g.arc(x + 15, y + h / 2, 9, 0, 7); g.fill();
    txt(Ln.num, x + 15 + (Ln.num.length > 1 ? 0.5 : 0), y + h / 2 + (Ln.num.length > 1 ? 3 : 4.5), Ln.num.length > 1 ? 7 : 12, Ln.fg, 'center', '"Press Start 2P"');
    txt('LIGNE ' + Ln.num, x + 29, y + 14, 12, sel ? '#ffffff' : '#a8b2c6');
    txt(Ln.diff, x + 29, y + 25, 10, sel ? Ln.dcol : '#6f7a90');
  });
  // une seule ligne d'information sur la ligne choisie
  const L0 = LN();
  txt(`${L0.st[0][0]} → ${L0.st[L0.st.length - 1][0]}${BEST ? '   ·   record ' + BEST : ''}`, W / 2, 114, 11, '#cfd6e6', 'center', 'VT323', W - 30);
  txt('◄  ►  choisir la ligne', W / 2, 126, 10, '#6f7a90', 'center');
  // bouton démarrer
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 4);
  g.font = '8px "Press Start 2P", monospace'; const bw = Math.ceil(g.measureText('ENTREE : PRENDRE LE SERVICE').width) + 20;
  g.fillStyle = `rgba(255,215,94,${0.15 + 0.2 * pulse})`; g.fillRect(W / 2 - bw / 2, 152, bw, 18);
  g.strokeStyle = '#ffd75e'; g.lineWidth = 1; g.strokeRect(W / 2 - bw / 2 + 0.5, 152.5, bw - 1, 17);
  txt('ENTREE : PRENDRE LE SERVICE', W / 2, 165, 8, '#ffffff', 'center', '"Press Start 2P"');
  txt('?  aide      T  tutoriel      F  plein écran', W / 2, 206, 10, '#6f7a90', 'center');
}

function drawEnd() {
  g.fillStyle = 'rgba(4,5,9,0.88)'; g.fillRect(0, 0, W, H);
  if (S.over) { txt('GAME OVER', W / 2, 18, 12, '#ff4a3a', 'center', '"Press Start 2P"'); txt(S.over.title, W / 2, 28, 11, '#ffb3a8', 'center', 'VT323', W - 20); }
  else txt('FIN DE SERVICE', W / 2, 18, 12, '#ffd75e', 'center', '"Press Start 2P"');
  txt('Station', 20, 32, 12, '#8fa0b8'); txt('Horaire', 112, 32, 12, '#8fa0b8'); txt('Arrêt', 158, 32, 12, '#8fa0b8'); txt('Voy.', 204, 32, 12, '#8fa0b8'); txt('Étoiles', 248, 32, 12, '#8fa0b8'); txt('Points', 366, 32, 12, '#8fa0b8', 'right');
  STATIONS.forEach((s, i) => {
    const y = 32 + (i + 1) * 9.6;
    const r = s.res;
    txt(s.name, 20, y, 12, '#e6ecf5', 'left', 'VT323', 88);
    if (r.offer > 0) txt(`${r.board}/${r.offer}`, 204, y, 12, r.left === 0 ? '#7dff8a' : '#ffb35e');
    if (i > 0) {
      if (r.closed) txt('fermée', 112, y, 12, '#9fe0ff');
      else if (r.skipped) txt('brûlée', 112, y, 12, '#ff6b5b');
      else if (r.dt !== null) {
        const ad = Math.abs(r.dt);
        txt(r.dt > 1 ? `+${r.dt} s` : r.dt < -1 ? `${r.dt} s` : 'à l\'heure', 112, y, 12, ad <= 1 ? '#7dff8a' : ad <= 5 ? '#ffd75e' : '#ff6b5b');
        const ae = Math.abs(r.err);
        txt(`${r.err >= 0 ? '+' : '−'}${ae.toFixed(1)} m`, 158, y, 12, ae <= 0.5 ? '#7dff8a' : ae <= 2 ? '#ffd75e' : '#ff6b5b');
      }
    }
    if (r.stars) ['p', 't', 'v'].forEach((k, j) => { if (r.stars[k] !== null && r.stars[k] !== undefined) txt('★', 248 + j * 10, y, 12, r.stars[k] ? '#ffd75e' : '#3a3e4a'); });
    if (r.mult > 1) txt('x' + r.mult, 282, y, 11, '#9fe0ff');
    const tot = r.pts + r.pen + 5 * r.board - 5 * r.left;
    txt(String(tot), 366, y, 12, tot >= 0 ? '#e6ecf5' : '#ff6b5b', 'right');
  });
  const max = (STATIONS.length - 1) * 200, b = S.base + Math.min(0, S.score - S.base);
  const rank = b >= max * 0.9 ? 'Conducteur légendaire' : b >= max * 0.7 ? 'Conducteur confirmé' : b >= max * 0.45 ? 'Conducteur stagiaire' : 'Retour au centre de formation…';
  S.missions.forEach((m, i) => {
    const ic = m.state === 'done' ? '★' : '✗', c = m.state === 'done' ? '#ffd75e' : '#ff6b5b';
    txt(ic + ' ' + m.short, 20 + i * 122, 152, 11, c, 'left', 'VT323', 116);
  });
  // bilan par pilier et point faible
  const served = STATIONS.filter((s, i) => i > 0 && s.res.stars), cnt = k => STATIONS.filter(s => s.res.stars && s.res.stars[k]).length;
  const nArr = Math.max(1, served.length), nDep = Math.max(1, STATIONS.filter(s => s.res.stars && s.res.stars.v !== null && s.res.stars.v !== undefined).length);
  const pil = [['la précision', cnt('p') / nArr], ['la ponctualité', cnt('t') / nArr], ['le remplissage', cnt('v') / nDep], ['la sécurité', secPct() / 100]];
  const weak = pil.reduce((a, b) => b[1] < a[1] ? b : a);
  const totStars = cnt('p') + cnt('t') + cnt('v');
  txt(`★ ${totStars} étoiles  ·  🛡 Sécurité ${secPct()} %  ·  Point faible : ${weak[0]}`, W / 2, 163, 12, '#e6ecf5', 'center', 'VT323', W - 16);
  txt(`Voyageurs : ${S.pax} / ${S.paxOffer}  ·  bonus trafic fluide +${S.trafBonus}`, W / 2, 175, 12, '#9fe0ff', 'center', 'VT323', W - 16);
  const med = medalOf(S.score);
  if (med) {   // médaille avec ruban
    const mx = W / 2 - 100;
    g.fillStyle = '#1d3c8f'; g.beginPath(); g.moveTo(mx - 4, 178); g.lineTo(mx + 4, 178); g.lineTo(mx + 2, 184); g.lineTo(mx - 2, 184); g.fill();
    g.fillStyle = med[2]; g.beginPath(); g.arc(mx, 188, 6, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.arc(mx - 2, 186, 2, 0, 7); g.fill();
    txt(med[1], mx + 10, 192, 12, med[2]);
  }
  txt(`SCORE : ${S.score}`, W / 2 + (med ? 26 : 0), 190, 17, '#ffd75e', 'center');
  if (S.newRecord) { if (Math.floor(S.t * 4) % 2) txt('NOUVEAU RECORD !', W / 2, 201, 13, '#7dff8a', 'center'); }
  else { const nm = nextMedal(S.score); txt(`Record : ${BEST}  ·  ${med ? 'médaille ' + med[1].toLowerCase() : 'pas de médaille'}${nm ? `  ·  ${nm[1].toLowerCase()} à ${nm[0]}` : ''}  ·  +${S.starsWon || 0} missions`, W / 2, 201, 12, '#cfd6e6', 'center', 'VT323', W - 16); }

  if (Math.floor(S.t * 2) % 2) txt('ENTREE OU R POUR REJOUER', W / 2, 211, 8, '#ffffff', 'center', '"Press Start 2P"');
}

function render() {
  g.setTransform(RES, 0, 0, RES, 0, 0);
  if (S.mode === 'title') { drawScene(); drawTitle(); if (S.help) drawHelp(); return; }
  drawScene();
  drawGauge();
  drawCab();
  if (S.mode === 'running' && S.phase !== 'drive') { drawCCTV(); drawPops(); drawTraffic(8, CAM_Y0 + CAM_H + 3 + (CAM_H - 44) / 2, 117); }
  if (S.mode === 'running' && S.phase === 'drive') { drawSchedChip(); drawLeaderPanel(); drawTopCam(); drawTrafficWarn(); }
  if (S.alarm && Math.floor(S.t * 4) % 2) { g.fillStyle = 'rgba(255,0,0,0.12)'; g.fillRect(0, 0, W, VIEW_H); }
  drawDoorAlarm();
  if (S.mode === 'running' && S.phase === 'drive' && S.person && S.person.state === 'track' && S.person.seen) {   // danger : cadre rouge pulsé
    const pz = 0.5 + 0.5 * Math.sin(S.t * 10);
    g.strokeStyle = `rgba(255,40,30,${0.4 + 0.6 * pz})`; g.lineWidth = 2.5; g.strokeRect(1.25, 1.25, W - 2.5, VIEW_H - 2.5);
    const vg = g.createRadialGradient(W / 2, VIEW_H / 2, VIEW_H * 0.4, W / 2, VIEW_H / 2, W * 0.62);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(255,0,0,${0.3 * pz})`); g.fillStyle = vg; g.fillRect(0, 0, W, VIEW_H);
  }
  drawFx();
  if (S.mode === 'running') { drawRadio(); drawAnnonce(); drawTheft(); }
  if (S.mode === 'running' && S.missionShow > 0 && !S.radio) {
    g.fillStyle = 'rgba(6,8,14,0.85)'; g.fillRect(W / 2 - 110, 54, 220, 50);
    drawMissions(W / 2 - 102, 66, false);
  }
  drawHint();
  drawTuto();
  drawMsgs();
  if (S.mode === 'title') drawTitle();
  if (S.mode === 'end') drawEnd();
  if (S.mode === 'running' && S.over) drawGameOver();
  if (S.help) drawHelp();
}

reset('title');
if (document.fonts) { document.fonts.load('12px VT323'); document.fonts.load('8px "Press Start 2P"'); }
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
